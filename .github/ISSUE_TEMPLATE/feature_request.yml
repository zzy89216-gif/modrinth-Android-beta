name: 💡 功能建议 / Feature Request
description: 提议新特性、改进现有功能或优化体验
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 感谢你的建议！请说明这个功能要解决什么问题。
  - type: textarea
    id: problem
    label: 要解决的问题 / 痛点
    description: 现在缺什么？为什么需要？
    required: true
  - type: textarea
    id: solution
    label: 建议方案
    description: 你希望这个功能长什么样？如何工作？
    required: true
  - type: textarea
    id: alternatives
    label: 替代方案（可选）
    description: 是否考虑过其他做法？
    required: false
  - type: textarea
    id: context
    label: 补充说明（可选）
    description: 相关截图、参考链接等
    required: false
  - type: dropdown
    id: priority
    label: 你认为的优先级
    options:
      - P1 必须
      - P2 重要
      - P3 锦上添花
    required: false
