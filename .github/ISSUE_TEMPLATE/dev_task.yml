name: 🔨 开发任务 / Dev Task
description: 开发者/贡献者提报的实现任务，需关联规划
title: "[TASK] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        > 面向开发者 / 贡献者。请关联项目规划，明确验收标准。
  - type: input
    id: phase
    label: 所属阶段
    description: P1 核心完善 / P2 用户功能 / P3 高级功能
    required: true
  - type: input
    id: module
    label: 涉及模块
    description: 如 app / data / domain / core，或 UI / 网络 / 存储
    required: true
  - type: textarea
    id: description
    label: 任务描述
    description: 要做什么，为什么做
    required: true
  - type: textarea
    id: acceptance
    label: 验收标准
    placeholder: |
      - [ ] 搜索输入关键词后 2 秒内返回结果列表
      - [ ] 空结果时显示空状态页
    required: true
  - type: textarea
    id: branch
    label: 分支 / 关联信息（可选）
    description: 功能分支名、相关 issue、API 文档链接
    required: false
  - type: dropdown
    id: estimate
    label: 工作量预估
    options:
      - S（< 半天）
      - M（1-2 天）
      - L（3 天以上）
    required: false
