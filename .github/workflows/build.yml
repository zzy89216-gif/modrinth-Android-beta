name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: adopt
    
    - name: Setup Android SDK
      run: |
        echo "sdkmanager not available, skipping SDK setup"
    
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
