name: PR Check

# 拉取请求快速检查：只做编译，几分钟出结果
# 避免大 PR 长时间排队，尽早发现编译错误
on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Compile check
      run: |
        chmod +x gradlew
        ./gradlew compileDebugKotlin --stacktrace

    - name: Kotlin format sanity (no gradle tasks fail on style)
      if: always()
      run: echo "PR check finished"
